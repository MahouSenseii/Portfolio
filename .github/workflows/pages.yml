name: Verify portfolio and publish Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Record tested revision
        run: git rev-parse HEAD
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify existing branch-based Pages source
        run: npm run test:browser
        env:
          PORTFOLIO_TEST_SOURCE: '1'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && vars.PAGES_DEPLOY_ENABLED == 'true'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && vars.PAGES_DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static output
        id: deployment
        uses: actions/deploy-pages@v4
