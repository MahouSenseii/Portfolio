<section id="contact" class="page-section content-page">
  <div class="page-shell">
    <h1 class="section-title">Contact Me</h1>

    <div class="contact-layout">
      <div class="page-lede">
        <p id="contact-availability" class="contact-availability"></p>

        <div class="contact-methods">
          <p>
            <strong>Email</strong>
            <a id="contact-email-link" href="#"><span id="contact-email-text"></span></a>
          </p>
          <p>
            <strong>Location</strong>
            <span id="contact-location"></span>
          </p>
        </div>

        <div class="button-row">
          <button id="copy-email" class="btn btn--small" type="button">Copy Email</button>
        </div>
        <p id="copy-email-status" class="visually-hidden" aria-live="polite"></p>

        <div class="social-icons contact-socials">
          <a id="contact-github" href="#" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <img src="img/github.webp" alt="">
          </a>
          <a id="contact-linkedin" href="#" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <img src="img/linkedin.webp" alt="">
          </a>
        </div>
      </div>

      <form id="contact-form" class="contact-form panel">
        <label>
          Name
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label>
          Reply Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="contact-form-wide">
          Subject
          <input type="text" name="subject" value="Portfolio Job Opportunity">
        </label>
        <label class="contact-form-wide">
          Message
          <textarea name="message" required></textarea>
        </label>
        <button class="btn btn--primary" type="submit">Open Email Draft</button>
      </form>
    </div>
  </div>
</section>
