<section id="projects" class="page-section showcase" data-theme="apps">
  <p class="sc-watermark" aria-hidden="true">
    <span class="sc-watermark-label">Project Showcase</span>
    <span class="sc-watermark-name" data-sc-watermark></span>
  </p>

  <div class="sc-stage">
    <aside class="sc-rail">
      <p class="sc-rail-title" id="project-rail-title">Disciplines</p>
      <div class="sc-rail-list" data-sc-rail role="group" aria-labelledby="project-rail-title"></div>
    </aside>

    <div class="sc-info">
      <div class="sc-info-head">
        <div class="sc-badges" data-sc-badges></div>
        <h1 class="sc-title" data-sc-title></h1>
        <p class="sc-kicker" data-sc-kicker></p>
        <hr class="rule rule--diamond">
      </div>

      <div class="sc-info-body">
        <p class="sc-summary" data-sc-summary></p>
        <dl class="meta-list sc-meta" data-sc-meta></dl>
        <ul class="chip-list sc-tags" data-sc-tags></ul>
        <div class="button-row sc-actions" data-sc-actions></div>
      </div>
    </div>

    <figure class="sc-hero" data-sc-hero>
      <div class="sc-hero-plate">
        <img class="sc-hero-img" data-sc-hero-img src="" alt="" decoding="async">
      </div>
    </figure>
  </div>

  <div class="sc-selector">
    <button class="sc-arrow" type="button" data-sc-prev aria-label="Previous project">&#10094;</button>
    <div class="sc-track" data-sc-track tabindex="0" role="group" aria-label="Project selector"></div>
    <button class="sc-arrow" type="button" data-sc-next aria-label="Next project">&#10095;</button>
  </div>

  <div class="overlay overlay--media" data-media-viewer hidden role="dialog" aria-modal="true" aria-label="Project media">
    <button class="overlay-close" type="button" data-overlay-close aria-label="Close media">&#10005;</button>
    <div class="overlay-stage" data-media-stage></div>
  </div>

  <div class="overlay overlay--drawer" data-details-panel hidden role="dialog" aria-modal="true" aria-label="Project details">
    <button class="overlay-close" type="button" data-overlay-close aria-label="Close details">&#10005;</button>
    <div class="overlay-panel" data-details-body></div>
  </div>
</section>
